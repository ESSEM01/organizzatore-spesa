# Controllo settimanale (D15, D20): volantini nuovi, supermercati di Roma, medie Osservaprezzi.
# Gira su GitHub Actions e scrive su Turso, così non serve un server sempre acceso.
# I segreti si impostano in Settings → Secrets and variables → Actions del repository.
name: Controllo settimanale

on:
  schedule:
    # Ogni lunedì alle 5:00 UTC (6:00 o 7:00 a Roma): i volantini nuovi escono di solito tra giovedì e lunedì.
    - cron: '0 5 * * 1'
  # Avvio a mano dalla scheda Actions, per provare.
  workflow_dispatch:

# Un controllo alla volta: se uno è ancora in corso, il successivo aspetta.
concurrency:
  group: controllo-settimanale
  cancel-in-progress: false

# Il job legge solo il codice: il token di GitHub non può scrivere sul repository.
permissions:
  contents: read

jobs:
  controllo:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_ENV: development
      TZ: Europe/Rome
      PORT: '3333'
      HOST: localhost
      LOG_LEVEL: info
      APP_URL: http://localhost:3333
      SESSION_DRIVER: cookie
      LIMITER_STORE: memory
      MAIL_MAILER: resend
      MAIL_FROM_NAME: Organizzatore spesa
      MAIL_FROM_ADDRESS: onboarding@resend.dev
      DB_CONNECTION: libsql
      LIMITE_SPESA_LLM_DOLLARI: '10'
    steps:
      # Azioni fissate allo SHA del commit: un tag spostato non cambia il codice eseguito.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Nessuno script di installazione: i binari nativi (swc, libsql) arrivano come dipendenze
      # opzionali già nel lockfile, quindi non servono.
      - run: npm ci --ignore-scripts
      - run: npm run build -w @spesa/domain
      # I segreti solo qui: installazione e build non li vedono.
      - name: Controllo dei volantini, dei negozi e di Osservaprezzi
        working-directory: apps/api
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node ace volantini:controlla
